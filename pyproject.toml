[project]
name = "dreamstyler"
version = "0.1.0"
description = ""
authors = [
    {name = "Frankson Souza"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio>=2.0.2",
    "diffusers (>=0.33.1,<0.34.0)",
    "transformers (>=4.51.3,<5.0.0)",
    "accelerate (>=1.6.0,<2.0.0)",
    "tensorflow (>=2.19.0,<3.0.0)",
    "tensorflow-hub (>=0.16.1,<0.17.0)",
    "gradio (>=5.27.0,<6.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "sentencepiece (>=0.2.0,<0.3.0)",
    "huggingface-hub (>=0.30.2,<0.31.0)",
    "streamlit (>=1.45.0,<2.0.0)",
    "scipy (>=1.15.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "dreamstyler", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
